[project]
name = "dl-segmentation-camus"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.1",
    "torch==2.12.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
